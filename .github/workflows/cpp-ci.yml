name: C++ CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make

      - name: Configure
        run: cmake -S . -B build -G "MinGW Makefiles" -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build application and tests
        run: cmake --build build --target StudentApp StudentTests --parallel 2

      - name: Run tests
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Upload Release application
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: StudentApp-windows-ucrt64-Release
          path: build/StudentApp.exe
          if-no-files-found: error
          retention-days: 7